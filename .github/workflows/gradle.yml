# Modified by OGDom445 on 2026-10-15: manual verification for unofficial GPL v3 fork.
name: Verify unofficial build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build and check both Geyser versions
        shell: pwsh
        run: ./tests/check.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unofficial-geyserfloatingpoints
          path: build/libs/geyserfloatingpoints.jar
          if-no-files-found: error
